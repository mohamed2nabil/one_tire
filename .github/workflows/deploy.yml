name: Deploy to cPanel
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Project
        run: pnpm build

      - name: Prepare Standalone Directory
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          echo "async function start() { try { await import('./server.mjs'); } catch (err) { console.error('Failed to start server:', err); process.exit(1); } } start();" > .next/standalone/server.js
          # ضغط الملفات بدلاً من رفعها فرادى
          cd .next/standalone
          zip -r ../../deploy.zip .
          cd ../../
          mkdir upload-dir
          mv deploy.zip upload-dir/
          # إنشاء ملف PHP لفك الضغط بسهولة
          echo "<?php \$z = new ZipArchive; if (\$z->open('deploy.zip') === TRUE) { \$z->extractTo('./'); \$z->close(); echo 'OK'; unlink('unzip.php'); unlink('deploy.zip'); } else { echo 'Failed'; } ?>" > upload-dir/unzip.php

      - name: Upload via cPanel API
        run: |
          curl -k -u "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.FTP_SERVER }}:2083/execute/Fileman/upload_files" \
            -F "dir=/home/${{ secrets.CPANEL_USERNAME }}/apps/one-tire" \
            -F "file-1=@upload-dir/deploy.zip"
          curl -k -u "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.FTP_SERVER }}:2083/execute/Fileman/upload_files" \
            -F "dir=/home/${{ secrets.CPANEL_USERNAME }}/apps/one-tire" \
            -F "file-1=@upload-dir/unzip.php"

      - name: Unzip on Server
        run: |
          curl -k -s "https://one-tire.com/unzip.php"

