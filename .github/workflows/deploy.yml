name: Deploy to cPanel
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Project
        run: pnpm build

      - name: Prepare Standalone Directory
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          echo "async function start() { try { await import('./server.mjs'); } catch (err) { console.error('Failed to start server:', err); process.exit(1); } } start();" > .next/standalone/server.js
          cd .next/standalone
          zip -r ../../deploy.zip .
          cd ../../

      - name: Upload to cPanel
        run: |
          echo "=== Logging into cPanel ==="
          LOGIN_RES=$(curl -s -k -c cookies.txt -X POST \
            --data-urlencode "user=${{ secrets.CPANEL_USERNAME }}" \
            --data-urlencode "pass=${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.FTP_SERVER }}:2083/login/?login_only=1")
          
          SESSION=$(echo "$LOGIN_RES" | grep -o '"security_token":"[^"]*"' | cut -d'"' -f4)
          
          if [ -z "$SESSION" ]; then
            echo "Login failed! Please check CPANEL_USERNAME and CPANEL_PASSWORD"
            exit 1
          fi
          
          echo "=== Uploading deploy.zip ==="
          RESPONSE=$(curl -s -k -b cookies.txt "https://${{ secrets.FTP_SERVER }}:2083$SESSION/execute/Fileman/upload_files" \
            -F "dir=apps/one-tire" \
            -F "file-1=@deploy.zip")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"errors":null' || (echo "Upload failed!" && exit 1)

      - name: Extract on Server
        run: |
          echo "=== Logging into cPanel ==="
          LOGIN_RES=$(curl -s -k -c cookies.txt -X POST \
            --data-urlencode "user=${{ secrets.CPANEL_USERNAME }}" \
            --data-urlencode "pass=${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.FTP_SERVER }}:2083/login/?login_only=1")
          SESSION=$(echo "$LOGIN_RES" | grep -o '"security_token":"[^"]*"' | cut -d'"' -f4)
          
          echo "=== Extracting deploy.zip ==="
          RESPONSE=$(curl -s -k -b cookies.txt "https://${{ secrets.FTP_SERVER }}:2083$SESSION/execute/Fileman/extract" \
            -d "archive_file=apps/one-tire/deploy.zip" \
            -d "directory=apps/one-tire")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"errors":null' || (echo "Extract failed!" && exit 1)

      - name: Cleanup zip
        run: |
          LOGIN_RES=$(curl -s -k -c cookies.txt -X POST \
            --data-urlencode "user=${{ secrets.CPANEL_USERNAME }}" \
            --data-urlencode "pass=${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.FTP_SERVER }}:2083/login/?login_only=1")
          SESSION=$(echo "$LOGIN_RES" | grep -o '"security_token":"[^"]*"' | cut -d'"' -f4)
          
          curl -s -k -b cookies.txt "https://${{ secrets.FTP_SERVER }}:2083$SESSION/execute/Fileman/trash" \
            -d "files=apps/one-tire/deploy.zip"
