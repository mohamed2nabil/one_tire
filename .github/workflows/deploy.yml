name: Deploy to cPanel
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Project
        run: pnpm build

      - name: Prepare Standalone Directory
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          echo "async function start() { try { await import('./server.mjs'); } catch (err) { console.error('Failed to start server:', err); process.exit(1); } } start();" > .next/standalone/server.js
          cd .next/standalone
          zip -r ../../deploy.zip .
          cd ../../

      - name: Upload to cPanel
        run: |
          echo "=== Uploading deploy.zip ==="
          RESPONSE=$(curl -s -k -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.FTP_SERVER }}:2083/execute/Fileman/upload_files" \
            -F "dir=/home/${{ secrets.CPANEL_USERNAME }}/apps/one-tire" \
            -F "file-1=@deploy.zip")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"errors":null' || (echo "Upload failed!" && exit 1)

      - name: Extract on Server
        run: |
          echo "=== Extracting deploy.zip ==="
          RESPONSE=$(curl -s -k -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.FTP_SERVER }}:2083/execute/Fileman/extract" \
            -d "archive_file=/home/${{ secrets.CPANEL_USERNAME }}/apps/one-tire/deploy.zip" \
            -d "directory=/home/${{ secrets.CPANEL_USERNAME }}/apps/one-tire")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"errors":null' || (echo "Extract failed!" && exit 1)

      - name: Cleanup zip
        run: |
          curl -s -k -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.FTP_SERVER }}:2083/execute/Fileman/trash" \
            -d "files=/home/${{ secrets.CPANEL_USERNAME }}/apps/one-tire/deploy.zip"
