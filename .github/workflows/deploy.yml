name: Deploy to cPanel
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Project
        run: pnpm build

      - name: Prepare Standalone Directory
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          echo "async function start() { try { await import('./server.mjs'); } catch (err) { console.error('Failed to start server:', err); process.exit(1); } } start();" > .next/standalone/server.js
          cd .next/standalone
          zip -r ../../deploy.zip .
          cd ../../

      - name: Upload via WebDisk (WebDAV)
        run: |
          echo "=== Generating unzip.php ==="
          echo "<?php \$z = new ZipArchive; if (\$z->open('deploy.zip') === TRUE) { \$z->extractTo('./'); \$z->close(); echo 'OK'; unlink('unzip.php'); unlink('deploy.zip'); } else { echo 'Failed'; } ?>" > unzip.php
          
          echo "=== Uploading deploy.zip via WebDisk ==="
          HTTP_CODE=$(curl -s -k -o webdav_response.txt -w "%{http_code}" -u "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" -T deploy.zip "https://server11.hhost.host:2078/apps/one-tire/deploy.zip")
          echo "HTTP Status: $HTTP_CODE"
          cat webdav_response.txt
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "204" ]; then
            echo "WebDisk Upload failed!"
            exit 1
          fi
          
          echo "=== Uploading unzip.php via WebDisk ==="
          curl -s -k -u "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" -T unzip.php "https://server11.hhost.host:2078/apps/one-tire/unzip.php"
          
          echo "=== Triggering Unzip ==="
          curl -k -s "https://one-tire.com/unzip.php"
          echo "Deployment Complete!"

