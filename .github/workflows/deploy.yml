name: Deploy to cPanel
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Project
        run: npm run build

      - name: Prepare Standalone Directory
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          
          # Fix Next.js file tracer dropping non-native Prisma engines
          mkdir -p .next/standalone/node_modules/
          cp -r node_modules/.prisma .next/standalone/node_modules/ || true
          cp -r node_modules/@prisma .next/standalone/node_modules/ || true
          
          cd .next/standalone
          zip -r ../../deploy.zip .
          cd ../../

      - name: Upload and Restart via Native SSH/SCP using Expect
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          USER: ${{ secrets.CPANEL_USERNAME }}
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
        run: |
          sudo apt-get install -y expect
          
          # Save SSH Key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
          
          # Create expect script for SCP
          cat << 'EOF' > scp.exp
          #!/usr/bin/expect -f
          set timeout -1
          set passphrase $env(PASSPHRASE)
          spawn scp -P 7195 -i ~/.ssh/id_rsa deploy.zip $env(USER)@$env(HOST):/home/onetirec/apps/one-tire/
          expect {
            "Enter passphrase for key" {
              send "$passphrase\r"
              exp_continue
            }
            eof
          }
          EOF
          chmod +x scp.exp
          
          # Create expect script for SSH
          cat << 'EOF' > ssh.exp
          #!/usr/bin/expect -f
          set timeout -1
          set passphrase $env(PASSPHRASE)
          spawn ssh -p 7195 -i ~/.ssh/id_rsa $env(USER)@$env(HOST) "cd /home/onetirec/apps/one-tire && unzip -o deploy.zip && rm deploy.zip && mkdir -p tmp && touch tmp/restart.txt"
          expect {
            "Enter passphrase for key" {
              send "$passphrase\r"
              exp_continue
            }
            eof
          }
          EOF
          chmod +x ssh.exp
          
          # Run scripts
          ./scp.exp
          ./ssh.exp
