name: Deploy to cPanel via FTP
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Project
        run: pnpm build

      - name: Prepare Standalone Directory
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          echo "async function start() { try { await import('./server.mjs'); } catch (err) { console.error('Failed to start server:', err); process.exit(1); } } start();" > .next/standalone/server.js
          # ضغط الملفات بدلاً من رفعها فرادى
          cd .next/standalone
          zip -r ../../deploy.zip .
          cd ../../
          mkdir upload-dir
          mv deploy.zip upload-dir/
          # إنشاء ملف PHP لفك الضغط بسهولة
          echo "<?php \$z = new ZipArchive; if (\$z->open('deploy.zip') === TRUE) { \$z->extractTo('./'); \$z->close(); echo 'OK'; unlink('unzip.php'); unlink('deploy.zip'); } else { echo 'Failed'; } ?>" > upload-dir/unzip.php

      - name: FTP Upload via lftp
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" ${{ secrets.FTP_SERVER }} <<EOF
          debug 3
          set ftp:ssl-allow yes
          set ftp:ssl-force no
          set ftp:ssl-protect-data no
          set ssl:verify-certificate no
          set ftp:passive-mode yes
          set net:timeout 60
          set net:max-retries 1
          cd /
          put upload-dir/deploy.zip
          put upload-dir/unzip.php
          bye
          EOF
