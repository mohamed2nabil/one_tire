name: Deploy to cPanel
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Build Project
        run: pnpm build

      - name: Prepare Standalone Directory
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          echo "async function start() { try { await import('./server.mjs'); } catch (err) { console.error('Failed to start server:', err); process.exit(1); } } start();" > .next/standalone/server.js
          cd .next/standalone
          zip -r ../../deploy.zip .
          cd ../../

      - name: Upload to cPanel
        run: |
          echo "=== Attempt 1: Logging into cPanel API ==="
          LOGIN_RES=$(curl -s -k -c cookies.txt -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -X POST \
            --data-urlencode "user=${{ secrets.CPANEL_USERNAME }}" \
            --data-urlencode "pass=${{ secrets.CPANEL_PASSWORD }}" \
            "https://server11.hhost.host:2083/login/?login_only=1")
          
          echo "Login Response: $LOGIN_RES"
          SESSION=$(echo "$LOGIN_RES" | grep -o '"security_token":"[^"]*"' | cut -d'"' -f4)
          
          if [ -n "$SESSION" ]; then
            echo "Login successful! Uploading..."
            RESPONSE=$(curl -s -k -b cookies.txt "https://server11.hhost.host:2083$SESSION/execute/Fileman/upload_files" \
              -F "dir=apps/one-tire" \
              -F "file-1=@deploy.zip")
            echo "Upload Response: $RESPONSE"
            
            echo "Extracting..."
            EXTRACT=$(curl -s -k -b cookies.txt "https://server11.hhost.host:2083$SESSION/execute/Fileman/extract" \
              -d "archive_file=apps/one-tire/deploy.zip" \
              -d "directory=apps/one-tire")
            echo "Extract Response: $EXTRACT"
            
            echo "Cleaning up..."
            curl -s -k -b cookies.txt "https://server11.hhost.host:2083$SESSION/execute/Fileman/trash" -d "files=apps/one-tire/deploy.zip"
            exit 0
          fi
          
          echo "=== Attempt 2: SFTP Fallback ==="
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="${{ secrets.CPANEL_PASSWORD }}"
          sshpass -e sftp -o StrictHostKeyChecking=no -P 22 ${{ secrets.CPANEL_USERNAME }}@server11.hhost.host <<EOF
          cd apps/one-tire
          put deploy.zip
          bye
          EOF
          
          echo "Upload via SFTP successful. Now unzipping via PHP..."
          echo "<?php \$z = new ZipArchive; if (\$z->open('deploy.zip') === TRUE) { \$z->extractTo('./'); \$z->close(); echo 'OK'; unlink('unzip.php'); unlink('deploy.zip'); } else { echo 'Failed'; } ?>" > unzip.php
          sshpass -e sftp -o StrictHostKeyChecking=no -P 22 ${{ secrets.CPANEL_USERNAME }}@server11.hhost.host <<EOF
          cd apps/one-tire
          put unzip.php
          bye
          EOF
          curl -k -s "https://one-tire.com/unzip.php"

